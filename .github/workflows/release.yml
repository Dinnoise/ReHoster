name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish ReHoster release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Read Maven version
        id: project
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=target/rehoster-$VERSION.jar" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: mvn -B clean package

      - name: Update download page
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.project.outputs.version }}"
          REPO="${GITHUB_REPOSITORY}"
          JAR_NAME="rehoster-${VERSION}.jar"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${JAR_NAME}"
          cat > DOWNLOAD.md <<EOF
          # Скачать ReHoster

          Актуальная версия: ${VERSION}

          Скачать JAR-файл: [${JAR_NAME}](${DOWNLOAD_URL})

          Релиз GitHub: https://github.com/${REPO}/releases/tag/${TAG}
          EOF

      - name: Commit updated download page
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update download link for ${{ github.ref_name }}"
          file_pattern: DOWNLOAD.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.project.outputs.jar }}
          generate_release_notes: true
